name: Sidha Samadhan Alarm - Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK (Without Wrapper)
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          find app/build/outputs -name "*.apk" -type f
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SidhaSamadhanAlarm-v1.0.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SidhaSamadhanAlarm-APK
          path: app/build/outputs/apk/debug/*.apk
